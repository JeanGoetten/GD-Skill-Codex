name: Validate framework

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation suite
        run: npm run test:all

      - name: Reject generated-data drift
        shell: pwsh
        run: |
          git diff --exit-code -- web/data.js
