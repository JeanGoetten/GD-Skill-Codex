name: Validate framework

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PowerShell (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell || (curl -sSL https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell_7.4.6-1.deb_amd64.deb -o pwsh.deb && sudo dpkg -i pwsh.deb)

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation suite
        run: npm run test:all

      - name: Reject generated-data drift
        shell: pwsh
        run: |
          git diff --exit-code -- web/data.js
          git diff --exit-code -- GD-Skill-Codex
